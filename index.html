<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kentech Software | Mobil Oyunlar</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; background: #f8f9fa; padding: 20px; color: #212529; margin: 0; }
        .container { max-width: 650px; margin: 40px auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .logo { width: 100px; height: 100px; border-radius: 22px; object-fit: cover; }
        h1 { margin-top: 15px; font-size: 28px; }
        p.subtitle { color: #6c757d; font-size: 16px; margin-bottom: 30px; }
        hr { border: 0; height: 1px; background: #e9ecef; margin: 30px 0; }
        .app-card { border: 1px solid #e9ecef; padding: 20px; border-radius: 12px; display: flex; align-items: center; gap: 20px; text-align: left; background: #fff; }
        .app-icon { width: 80px; height: 80px; border-radius: 18px; object-fit: cover; }
        .app-info { flex: 1; }
        .app-title { margin: 0 0 5px 0; font-size: 20px; }
        .app-desc { margin: 0 0 12px 0; color: #6c757d; font-size: 14px; }
        .btn { display: inline-block; padding: 10px 18px; background: #0175C2; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; }
        .btn:hover { background: #0056b3; }
        footer { margin-top: 40px; font-size: 14px; color: #6c757d; }
        footer a { color: #0175C2; text-decoration: none; font-weight: 500; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Kentech Software Logo" class="logo" onerror="this.src='https://via.placeholder.com/100?text=Kentech'">
    <h1>Kentech Software</h1>
    <p class="subtitle">Mobil Oyun & Uygulama Geliştirme Stüdyosu</p>

    <hr>

    <h2 style="text-align: left; font-size: 20px;">Oyunlarımız</h2>
    
    <div class="app-card">
        <img src="app-icon.png" alt="Jumping Bird" class="app-icon" onerror="this.src='https://via.placeholder.com/80?text=Bird'">
        <div class="app-info">
            <h3 class="app-title">Jumping Bird</h3>
            <p class="app-desc">Engelleri aşın, sınırları zorlayın ve en yüksek skora ulaşın!</p>
            <a href="https://play.google.com/store/apps/details?id=com.kentechtr.jumping_bird" class="btn" target="_blank">Google Play'de İndir</a>
        </div>
    </div>

    <footer>
        <p>
            <a href="privacy-policy.html">Gizlilik Politikası</a> &bull; 
            <a href="mailto:kentechtr@gmail.com">Destek ve İletişim</a>
        </p>
        <p>&copy; 2026 Kentech Software. Tüm hakları saklıdır.</p>
    </footer>
</div>

</body>
</html>
